# ── Stock Prediction Portal — Docker Compose ────────────────
# Usage:
#   docker compose up --build        (first time / after code changes)
#   docker compose up -d             (detached mode)
#   docker compose down              (stop everything)
#   docker compose logs -f backend   (tail backend logs)

services:

  # ── PostgreSQL Database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_portal}
      POSTGRES_USER: ${POSTGRES_USER:-stockuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpass123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockuser} -d ${POSTGRES_DB:-stock_portal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Broker ──────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Django Backend (DRF + LSTM Model) ─────────────────────
  backend:
    build:
      context: ./stock_prediction_portal
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-stockuser}:${POSTGRES_PASSWORD:-stockpass123}@db:5432/${POSTGRES_DB:-stock_portal}
      - DJANGO_SETTINGS_MODULE=core.settings
      - REDIS_URL=redis://redis:6379/1
      - REDIS_URL_CACHE=redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_cache:/app/stocks   # persist ML model artifacts

  # ── Celery Worker ─────────────────────────────────────────
  celery_worker:
    build:
      context: ./stock_prediction_portal
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A core worker -l info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-stockuser}:${POSTGRES_PASSWORD:-stockpass123}@db:5432/${POSTGRES_DB:-stock_portal}
      - REDIS_URL=redis://redis:6379/1
      - REDIS_URL_CACHE=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_cache:/app/stocks

  # ── React Frontend (Vite + Nginx) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  model_cache:
